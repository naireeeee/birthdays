<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise ✨</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&family=Dancing+Script:wght@700&display=swap');

    :root {
      /* PURPLE THEME COLORS (FOR ENVELOPE) */
      --purple-light: #d8b4fe;
      --purple-main: #a855f7;
      --purple-dark: #6b21a8;
      --purple-glow: #c084fc;
      --env-paper: #fcfaff;
      --bg-dark: #0f172a; /* Neutral Dark Slate background */

      --w: min(580px, 92vw);
      --h: 360px;
      --triH: 190px;
      --pocketH: 190px;
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      perspective: 1500px;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- MUSIC TOGGLE BUTTON --- */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .music-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    /* --- DYNAMIC BACKGROUND ORBS --- */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.35;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: #3b82f6; top: -10%; left: -10%; }
    .orb-2 { width: 450px; height: 450px; background: #1e1b4b; bottom: -15%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 30%; animation-delay: -2s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    /* --- FLOATING BALLOONS --- */
    .balloon-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 50px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.7;
      animation: floatUp 8s linear infinite;
    }
    .balloon::before {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: rgba(255, 255, 255, 0.5);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }

    /* --- FIRST PAGE (INTRO CARD - GOLD & WHITE AESTHETIC) --- */
    #intro {
      position: relative;
      text-align: center;
      cursor: pointer;
      color: #fff;
      z-index: 100;
      padding: 40px 45px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform 0.1s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      transform-style: preserve-3d;
      max-width: 90vw;
    }

    #intro:hover {
      border-color: rgba(251, 191, 36, 0.6);
      box-shadow: 0 40px 90px rgba(251, 191, 36, 0.2), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .svg-anim {
      width: 140px;
      height: 140px;
      margin: 0 auto 15px;
      display: block;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
    }

    /* SVG Animations */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      50% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    }
    .flame {
      animation: flameFlicker 0.6s infinite ease-in-out;
      transform-origin: center bottom;
    }

    @keyframes catTailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    .tail {
      animation: catTailWag 1.5s infinite ease-in-out;
      transform-origin: left bottom;
    }

    @keyframes catBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .eye {
      animation: catBlink 3.5s infinite;
      transform-origin: center;
    }

    .hbd-main {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 600;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(245, 158, 11, 0.3));
    }

    .sub-text {
      margin-top: 18px;
      font-size: 0.8rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .sub-text::before, .sub-text::after {
      content: "";
      width: 20px; height: 1px;
      background: rgba(255, 255, 255, 0.4);
    }

    .hidden{ opacity:0; pointer-events:none; transition:.5s cubic-bezier(0.4, 0, 0.2, 1); transform: scale(0.9) translateY(-20px) !important; }

    /* --- PURPLE ENVELOPE WRAPPER --- */
    .envelope-wrapper {
      position: relative;
      width: var(--w);
      height: var(--h);
      display: none;
      cursor: pointer;
      filter: drop-shadow(0 40px 60px rgba(0,0,0,0.7));
      transform-style: preserve-3d;
      user-select: none;
      z-index: 10;
    }

    .envelope-wrapper.enter {
      animation: enter 900ms cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    .envelope {
      position: absolute;
      inset: 0;
      background: var(--env-paper);
      background-image: radial-gradient(rgba(168, 85, 247, 0.25) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      border-radius: 0 0 var(--radius) var(--radius);
      z-index: 10;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .envelope::before {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      width: 75px; height: 100%;
      background: linear-gradient(90deg, var(--purple-dark), var(--purple-glow) 50%, var(--purple-dark));
      transform: translateX(-50%);
      z-index: 11;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    .env-hbd-title {
      position: absolute;
      top: 22%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 42;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 5.5vw, 3.2rem);
      color: var(--purple-dark); 
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .click-label {
      position: absolute;
      top: 65%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 45;
      color: var(--purple-dark);
      font-weight: 800;
      letter-spacing: 2.5px;
      font-size: 0.7rem;
      text-transform: uppercase;
      background: #ffffff;
      padding: 9px 20px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      animation: floatGlow 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes floatGlow {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
      50% { transform: translate(-50%, -50%) translateY(-5px); box-shadow: 0 15px 30px rgba(192, 132, 252, 0.5); }
    }

    .flap {
      position: absolute;
      top: 0; left: 50%;
      width: 0; height: 0;
      border-left: calc(var(--w)/2) solid transparent;
      border-right: calc(var(--w)/2) solid transparent;
      border-top: var(--triH) solid #f3e8ff;
      transform: translateX(-50%);
      transform-origin: top center;
      transition: transform 850ms cubic-bezier(.2,.9,.2,1);
      z-index: 40;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
    }

    .pocket {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: calc(var(--w)/2) solid var(--env-paper);
      border-right: calc(var(--w)/2) solid var(--env-paper);
      border-bottom: var(--pocketH) solid var(--env-paper);
      border-top: 170px solid transparent;
      z-index: 30;
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .pocket::after {
      content: "";
      position: absolute;
      bottom: 55px; left: -300px;
      width: 600px; height: 55px;
      background: linear-gradient(90deg, var(--purple-dark), var(--purple-glow) 50%, var(--purple-dark));
      z-index: 31;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* --- LETTER --- */
    .letter {
      position: absolute;
      left: 5%; bottom: 15px;
      width: 90%; height: 90%;
      background: #ffffff;
      z-index: 20;
      border-radius: 16px;
      padding: 35px 28px 25px;
      text-align: center;
      transition: all 900ms cubic-bezier(.2,1,.2,1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      overflow-y: auto;
    }

    .letter h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: var(--purple-dark);
      margin: 0 0 10px 0;
    }

    .letter p {
      font-size: 0.98rem;
      line-height: 1.75;
      color: #2d3436;
      margin: 10px 0 0;
      font-weight: 400;
      min-height: 120px;
    }

    .signature {
      margin-top: 25px;
      font-weight: 800;
      color: var(--purple-dark);
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    /* OPEN STATE */
    .envelope-wrapper.open .flap {
      transform: translateX(-50%) rotateX(180deg);
      z-index: 5;
    }

    .envelope-wrapper.open .letter {
      bottom: auto; top: 50%;
      transform: translateY(-50%) scale(1.03);
      z-index: 55;
      box-shadow: 0 35px 80px rgba(0,0,0,0.5);
      border-top: 6px solid var(--purple-main);
    }

    .envelope-wrapper.open .env-hbd-title,
    .envelope-wrapper.open .click-label {
      opacity: 0;
    }

    .close-btn {
      position: absolute;
      top: 14px; right: 14px;
      width: 32px; height: 32px;
      background: #f3e8ff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--purple-dark); font-size: 18px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 60;
    }

    .close-btn:hover { background: #e9d5ff; color: #3b0764; transform: rotate(90deg); }
    .envelope-wrapper.open .close-btn { opacity: 1; }

    /* EFFECTS LAYER */
    .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
    .confetti { position: absolute; top: -10vh; animation: fall linear forwards; border-radius: 3px; }

    .sparkle {
      position: fixed;
      pointer-events: none;
      background: radial-gradient(circle, #fff 10%, #f59e0b 30%, transparent 70%);
      border-radius: 50%;
      animation: fadeOut 1s ease-out forwards;
      z-index: 1000;
    }

    .firework-particle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1001;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    @keyframes enter {
      0%{ opacity: 0; transform: translateY(50px) scale(.9); }
      100%{ opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }
    @keyframes fadeOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>

<body>
  <button class="music-btn" id="musicToggle" onclick="toggleMusic(event)">🎵 Play Song</button>

  <div class="balloon-container" id="balloonContainer"></div>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="fx-layer" id="fxLayer"></div>

  <!-- INTRO PAGE (NATURAL / GOLDEN CAT CREED AESTHETIC) -->
  <div id="intro" onclick="showEnvelope(event)">
    <svg class="svg-anim" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path class="tail" d="M160 140 Q185 120 175 90" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none"/>
      <ellipse cx="100" cy="135" rx="55" ry="45" fill="#fcd34d"/>
      <circle cx="65" cy="170" r="12" fill="#ffffff"/>
      <circle cx="135" cy="170" r="12" fill="#ffffff"/>
      <circle cx="100" cy="85" r="42" fill="#fcd34d"/>
      <polygon points="65,55 50,20 85,45" fill="#d97706"/>
      <polygon points="135,55 150,20 115,45" fill="#d97706"/>
      <circle class="eye" cx="82" cy="80" r="6" fill="#1e293b"/>
      <circle class="eye" cx="118" cy="80" r="6" fill="#1e293b"/>
      <polygon points="96,90 104,90 100,95" fill="#ef4444"/>
      <line x1="60" y1="92" x2="40" y2="88" stroke="#b45309" stroke-width="2"/>
      <line x1="60" y1="96" x2="38" y2="98" stroke="#b45309" stroke-width="2"/>
      <line x1="140" y1="92" x2="160" y2="88" stroke="#b45309" stroke-width="2"/>
      <line x1="140" y1="96" x2="162" y2="98" stroke="#b45309" stroke-width="2"/>
      <polygon points="100,15 80,50 120,50" fill="#f59e0b"/>
      <circle cx="100" cy="12" r="5" fill="#ef4444"/>
      <rect x="70" y="145" width="60" height="30" rx="5" fill="#f43f5e"/>
      <rect x="66" y="140" width="68" height="10" rx="3" fill="#ffffff"/>
      <rect x="97" y="125" width="6" height="15" fill="#fef08a"/>
      <path class="flame" d="M100 112 Q105 120 100 125 Q95 120 100 112 Z" fill="#f59e0b"/>
    </svg>

    <h1 class="hbd-main">Happy Birthday!</h1>
    <div class="sub-text">CLICK ME!!</div>
  </div>

  <!-- ENVELOPE PAGE (PURPLE THEME) -->
  <div class="envelope-wrapper" id="mainEnv" onclick="openEnvelope(event)">
    <div class="envelope"></div>
    <div class="flap"></div>

    <div class="env-hbd-title">Happy Birthday</div>
    <div class="click-label">TAP TO OPEN ✉️</div>

    <div class="letter" role="dialog">
      <div class="close-btn" id="closeBtn">×</div>
      <h2>Happy Birthday!</h2>

      <p id="letterText"></p>
      <div class="signature">— Naire</div>
    </div>

    <div class="pocket"></div>
  </div>

  <script>
    const intro = document.getElementById('intro');
    const env = document.getElementById('mainEnv');
    const fx = document.getElementById('fxLayer');
    const closeBtn = document.getElementById('closeBtn');
    const letterText = document.getElementById('letterText');
    const musicBtn = document.getElementById('musicToggle');

    const fullText = "Today is your special day and my wish for you is that you be happy, healthy, and that your dreams come true. I know sometimes you feel pressured, and that's normal as a stupidyante. Just always do your best; you don't need to be good at everything. It's enough that you put in effort and gave your best.\n\nThank you for always being there for me. You just don't know how you ease the sadness I experience every day. Just know that I am always here for you too. I may not be that good at giving advice, but I promise I will always listen to your stories. And once again, happy birthday!";

    let hasOpened = false;
    let isTyping = false;
    let isPlayingAudio = false;
    let audioTimeout = null;

    // --- WEB AUDIO API SYNTHESIZER ---
    let audioCtx = null;

    const notes = {
      'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
      'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25, 'D5': 587.33
    };

    const songMelody = [
      { note: 'G4', duration: 0.35 }, { note: 'G4', duration: 0.15 }, { note: 'A4', duration: 0.5 }, { note: 'G4', duration: 0.5 }, { note: 'C5', duration: 0.5 }, { note: 'B4', duration: 0.9 },
      { note: 'G4', duration: 0.35 }, { note: 'G4', duration: 0.15 }, { note: 'A4', duration: 0.5 }, { note: 'G4', duration: 0.5 }, { note: 'D5', duration: 0.5 }, { note: 'C5', duration: 0.9 },
      { note: 'G4', duration: 0.35 }, { note: 'G4', duration: 0.15 }, { note: 'G4', duration: 0.5 }, { note: 'E4', duration: 0.5 }, { note: 'C5', duration: 0.5 }, { note: 'B4', duration: 0.5 }, { note: 'A4', duration: 0.9 },
      { note: 'F4', duration: 0.35 }, { note: 'F4', duration: 0.15 }, { note: 'E4', duration: 0.5 }, { note: 'C5', duration: 0.5 }, { note: 'D5', duration: 0.5 }, { note: 'C5', duration: 1.1 }
    ];

    function playNote(freq, duration, delay) {
      if (!isPlayingAudio || !audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playBirthdaySong() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isPlayingAudio = true;
      musicBtn.innerHTML = '⏸️ Pause Song';

      let currentTime = 0;
      songMelody.forEach((item) => {
        playNote(notes[item.note], item.duration, currentTime);
        currentTime += item.duration + 0.05;
      });

      audioTimeout = setTimeout(() => {
        if (isPlayingAudio) playBirthdaySong();
      }, currentTime * 1000 + 400);
    }

    function stopMusic() {
      isPlayingAudio = false;
      if (audioTimeout) clearTimeout(audioTimeout);
      musicBtn.innerHTML = '🎵 Play Song';
    }

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      if (isPlayingAudio) {
        stopMusic();
      } else {
        playBirthdaySong();
      }
    }

    document.addEventListener('click', function initAudio() {
      if (!isPlayingAudio) playBirthdaySong();
      document.removeEventListener('click', initAudio);
    }, { once: true });

    // Floating Balloons
    const balloonColors = ['#f59e0b', '#3b82f6', '#ec4899', '#a855f7', '#10b981', '#f43f5e'];
    const balloonContainer = document.getElementById('balloonContainer');

    for (let i = 0; i < 15; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
      balloon.style.animationDelay = (Math.random() * 8) + 's';
      balloon.style.animationDuration = (6 + Math.random() * 6) + 's';
      balloonContainer.appendChild(balloon);
    }

    // 3D Tilt Effect
    document.addEventListener('mousemove', (e) => {
      if (intro.style.display === 'none') return;
      const xAxis = (window.innerWidth / 2 - e.clientX) / 25;
      const yAxis = (window.innerHeight / 2 - e.clientY) / 25;
      intro.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;

      if (Math.random() < 0.3) spawnSparkle(e.clientX, e.clientY);
    });

    function spawnSparkle(x, y) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      const size = Math.random() * 8 + 4;
      sp.style.width = size + 'px';
      sp.style.height = size + 'px';
      sp.style.left = x + 'px';
      sp.style.top = y + 'px';
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 1000);
    }

    // Fireworks
    function createFireworks(x, y) {
      const colors = ['#f59e0b', '#3b82f6', '#ec4899', '#a855f7', '#10b981', '#ffffff'];
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'firework-particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];

        const angle = Math.random() * Math.PI * 2;
        const velocity = 50 + Math.random() * 120;
        p.style.setProperty('--dx', Math.cos(angle) * velocity + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * velocity + 'px');

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // Confetti
    setInterval(() => {
      if (intro.style.display !== 'none') createConfetti(1);
    }, 400);

    function createConfetti(num) {
      for(let i = 0; i < num; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.width = (6 + Math.random() * 6) + 'px';
        c.style.height = (10 + Math.random() * 8) + 'px';
        c.style.background = ['#f59e0b','#3b82f6','#ec4899','#a855f7','#10b981','#f43f5e'][Math.floor(Math.random()*6)];
        c.style.animationDuration = (3 + Math.random() * 2) + 's';
        fx.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
    }

    function showEnvelope(e) {
      createFireworks(e.clientX, e.clientY);
      if (!isPlayingAudio) playBirthdaySong();

      intro.classList.add('hidden');
      setTimeout(() => {
        intro.style.display = 'none';
        env.style.display = 'block';
        env.classList.add('enter');
      }, 500);
    }

    function openEnvelope(e) {
      if (hasOpened) return;
      hasOpened = true;
      createFireworks(e.clientX, e.clientY);
      env.classList.add('open');
      createConfetti(90);

      if (!isPlayingAudio) playBirthdaySong();

      // Typewriter Effect
      if (!isTyping) {
        isTyping = true;
        letterText.innerHTML = '';
        let index = 0;
        const typeInterval = setInterval(() => {
          if (index < fullText.length) {
            const char = fullText.charAt(index);
            letterText.innerHTML += char === '\n' ? '<br><br>' : char;
            index++;
          } else {
            clearInterval(typeInterval);
          }
        }, 15);
      }
    }

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      env.classList.remove('open');
      hasOpened = false;
    });
  </script>
</body>
</html>
